                        continue;
                    }
                    const paragraph = [line];
                    i++;
                    while (
                        i < lines.length &&
                        !blank(lines[i]) &&
                        !special(lines[i]) &&
                        !(
                            lines[i].includes("|") &&
                            i + 1 < lines.length &&
                            /\|?\s*:?-{3,}/.test(lines[i + 1])
                        )
                    ) {
                        paragraph.push(lines[i++]);
                    }
                    html += `<p>${inline(paragraph.join(" "))}</p>`;
                }
                return html;
            }
            const welcome = document.getElementById("welcome"),
                guide = document.getElementById("guide");
            const titles = {
                recommended: ["Рекомендуемый способ", "Основной способ"],
                alternative: ["Альтернативный способ", "Другой способ"],
            };
            function showGuide(type) {
                if (!Object.hasOwn(guides, type)) return;
                document.getElementById("guide-tag").textContent =
                    titles[type][0];
                document.getElementById("guide-title").textContent =
                    titles[type][1];
                document.getElementById("content").innerHTML = markdown(
                    guides[type],
                );
                welcome.classList.add("hidden");
                guide.classList.remove("hidden");
                history.replaceState(null, "", "#" + type);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
            function showWelcome() {
                guide.classList.add("hidden");
                welcome.classList.remove("hidden");
                history.replaceState(
                    null,
                    "",
                    location.pathname + location.search,
                );
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
            document
                .querySelectorAll("[data-guide]")
                .forEach((btn) =>
                    btn.addEventListener("click", () =>
                        showGuide(btn.dataset.guide),
                    ),
                );
            document
                .getElementById("back")
                .addEventListener("click", showWelcome);
            const initial = location.hash.slice(1);
            if (Object.hasOwn(guides, initial)) showGuide(initial);
        </script>
    </body>
</html>
